<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RE:Break the LOOP</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="game-page">
  <header class="hud"><button id="reset" aria-label="最初からやり直す">RESET</button><p id="trail" aria-label="撃った言葉">—</p><p id="hint">気になるものを撃つ</p></header>
  <main id="room" class="room room-l" aria-live="polite">
    <div class="wall-title" id="title">RE:Break the LOOP</div>
    <div id="scene" class="scene"></div>
    <button id="door" class="door" hidden aria-label="次の部屋へ進む"><span class="knob"></span><small>OPEN</small></button>
    <div id="message" class="message" role="status"></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
